[package]
name = "tdashcam-studio"
version = "1.0.0"
description = "TDashcam Studio - Multi-camera dashcam player"
authors = [""]
edition = "2021"

[lib]
name = "tdashcam_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"

# dialog + shell have no mobile implementations; keep them desktop-only so the
# Android target can link.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
